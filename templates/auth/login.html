<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Interviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        [data-currency-select], [data-theme-toggle] { color: #e2e8f0; border-color: rgba(255, 255, 255, 0.2); background-color: rgba(255, 255, 255, 0.05); }
        [data-theme-toggle] .iconify { color: #e2e8f0; }
        body, header, footer, section, article, form, input, textarea, button, select, a, .iconify { transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, box-shadow 220ms ease; }
        body.light-mode { background: linear-gradient(180deg, #f6fbff 0%, #eef4ff 50%, #f8fbff 100%) !important; color: #0f172a !important; }
        body.light-mode p, body.light-mode span, body.light-mode label, body.light-mode small, body.light-mode li, body.light-mode td, body.light-mode th, body.light-mode h1, body.light-mode h2, body.light-mode h3, body.light-mode h4, body.light-mode h5, body.light-mode h6, body.light-mode .sub, body.light-mode .row, body.light-mode .forgot, body.light-mode .logo, body.light-mode .logo a { color: #1e293b !important; }
        body.light-mode [class*='bg-slate-950'], body.light-mode [class*='bg-slate-900'], body.light-mode [class*='bg-slate-800'], body.light-mode [class*='bg-white/5'], body.light-mode [class*='bg-white/10'] { background: rgba(255, 255, 255, 0.86) !important; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        body.light-mode [class*='border-white'] { border-color: rgba(30, 41, 59, 0.12) !important; }
        body.light-mode [class*='text-white'] { color: #0b1b34 !important; }
        body.light-mode [class*='text-slate-100'], body.light-mode [class*='text-slate-200'], body.light-mode [class*='text-slate-300'], body.light-mode [class*='text-slate-400'], body.light-mode [class*='text-slate-500'] { color: #334155 !important; }
        body.light-mode a { color: #1d4ed8; }
        body.light-mode a:hover { color: #1e40af; }
        body.light-mode .iconify, body.light-mode i, body.light-mode svg, body.light-mode .fas, body.light-mode .far, body.light-mode .fab { color: #1e293b !important; fill: currentColor; }
        body.light-mode header, body.light-mode footer { background: rgba(255, 255, 255, 0.72) !important; border-color: rgba(30, 41, 59, 0.13) !important; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06); }
        body.light-mode input, body.light-mode textarea, body.light-mode select { background-color: #ffffff !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
        body.light-mode input::placeholder, body.light-mode textarea::placeholder { color: #64748b !important; }
        body.light-mode button { color: #0f172a !important; }
        body.light-mode [class*='bg-violet-600'], body.light-mode [class*='from-violet-600'], body.light-mode [class*='to-indigo-600'], body.light-mode [class*='bg-indigo-600'], body.light-mode .btn, body.light-mode .btn * { color: #ffffff !important; box-shadow: 0 10px 22px rgba(79, 70, 229, 0.22); }
        body.light-mode [data-currency-select], body.light-mode [data-theme-toggle] { color: #0f172a !important; border-color: #cbd5e1 !important; background-color: #ffffff !important; box-shadow: 0 3px 12px rgba(15, 23, 42, 0.07); }
        body.light-mode [data-theme-toggle] .iconify { color: #0f172a !important; }
        body.light-mode .pointer-events-none.fixed, body.light-mode .absolute.inset-0.-z-10 { opacity: 0.08; filter: saturate(0.8); }
        body.light-mode [class*='rounded-2xl'], body.light-mode [class*='rounded-3xl'] { box-shadow: 0 12px 26px rgba(15, 23, 42, 0.06); }
        body:not(.light-mode) .faq-item { background: rgba(15, 23, 42, 0.92) !important; border-color: rgba(148, 163, 184, 0.22) !important; box-shadow: 0 14px 28px rgba(2, 6, 23, 0.45) !important; }
        body:not(.light-mode) .faq-item h3 { color: #e2e8f0 !important; }
        body:not(.light-mode) .faq-content { color: #cbd5e1 !important; }
        body:not(.light-mode) .faq-icon { color: #818cf8 !important; }
        body:not(.light-mode) #faqSearch { background-color: rgba(15, 23, 42, 0.78) !important; border-color: rgba(129, 140, 248, 0.35) !important; color: #f1f5f9 !important; }
        body:not(.light-mode) #faqSearch::placeholder { color: #94a3b8 !important; }
        body:not(.light-mode) .category-btn { border-color: rgba(99, 102, 241, 0.55) !important; color: #c7d2fe !important; background: rgba(79, 70, 229, 0.14) !important; }
        body:not(.light-mode) .category-btn.bg-indigo-600 { color: #ffffff !important; background: #4f46e5 !important; }
    </style>
</head>
<body class="min-h-screen overflow-hidden bg-[#020617] text-white">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_20%_30%,rgba(124,58,237,0.22),transparent_40%),radial-gradient(circle_at_80%_70%,rgba(99,102,241,0.16),transparent_40%)]"></div>

    <main class="relative mx-auto flex min-h-screen max-w-md items-center px-4 py-8">
        <section id="tiltCard" data-aos="fade-up" data-aos-duration="900" class="w-full rounded-3xl border border-white/10 bg-slate-900/75 p-8 shadow-[0_30px_80px_rgba(0,0,0,0.6)] backdrop-blur-2xl transition-transform duration-200 [transform-style:preserve-3d]">
            <div class="text-center">
                <div class="mx-auto mb-2 inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-500/15 text-violet-200 ring-1 ring-violet-300/20 hover-lift" data-aos="zoom-in" data-aos-delay="50">
                    <span class="iconify text-2xl" data-icon="mdi:robot-outline"></span>
                </div>
                <p class="text-sm font-semibold tracking-wide text-violet-300">AI Interviewer</p>
                <h1 class="mt-2 text-3xl font-bold">Welcome Back!</h1>
                <p class="mt-1 text-sm text-slate-400">Sign in to your account.</p>
            </div>

            {% if error %}
            <div class="rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="mt-6 space-y-4">

                <label class="group relative block">
                    <input id="email" name="email" type="email" required placeholder=" " class="peer w-full rounded-xl border border-white/10 bg-transparent px-11 py-3 text-sm text-white outline-none transition focus:border-violet-400 focus:shadow-[0_0_12px_rgba(124,58,237,0.5)]">
                    <span class="iconify pointer-events-none absolute left-3 top-3.5 text-slate-400" data-icon="mdi:email-outline"></span>
                    <span class="pointer-events-none absolute left-11 top-3.5 text-sm text-slate-400 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-focus:-top-2 peer-focus:left-3 peer-focus:bg-slate-900 peer-focus:px-1 peer-focus:text-xs peer-focus:text-violet-300 peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:left-3 peer-[:not(:placeholder-shown)]:bg-slate-900 peer-[:not(:placeholder-shown)]:px-1 peer-[:not(:placeholder-shown)]:text-xs">Email Address</span>
                </label>

                <label class="group relative block">
                    <input id="password" name="password" type="password" required placeholder=" " class="peer w-full rounded-xl border border-white/10 bg-transparent px-11 py-3 text-sm text-white outline-none transition focus:border-violet-400 focus:shadow-[0_0_12px_rgba(124,58,237,0.5)]">
                    <span class="iconify pointer-events-none absolute left-3 top-3.5 text-slate-400" data-icon="mdi:lock-outline"></span>
                    <span class="pointer-events-none absolute left-11 top-3.5 text-sm text-slate-400 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-focus:-top-2 peer-focus:left-3 peer-focus:bg-slate-900 peer-focus:px-1 peer-focus:text-xs peer-focus:text-violet-300 peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:left-3 peer-[:not(:placeholder-shown)]:bg-slate-900 peer-[:not(:placeholder-shown)]:px-1 peer-[:not(:placeholder-shown)]:text-xs">Password</span>
                </label>

                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span></span>
                    <a href="/forgot-password" class="transition hover:text-violet-300">Forgot Password?</a>
                </div>

                <button type="submit" class="group relative mt-1 w-full overflow-hidden rounded-xl bg-gradient-to-r from-violet-600 to-indigo-500 px-4 py-3 font-semibold text-white transition hover:shadow-[0_10px_30px_rgba(124,58,237,0.4)]">
                    <span class="absolute inset-y-0 -left-20 w-16 rotate-12 bg-white/40 blur-sm transition-all duration-700 group-hover:left-[120%]"></span>
                    Sign In
                </button>
            </form>

            <p class="mt-4 text-center text-xs text-slate-400">
                Do not have an account?
                <a href="/signup" class="font-semibold text-slate-200 hover:text-white">Sign Up</a>
            </p>
        </section>
    </main>

    <button type="button" data-theme-toggle data-theme-icon-only aria-label="Light Mode" class="fixed bottom-5 right-5 z-50 inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/20 bg-slate-900/85 text-slate-100 shadow-lg backdrop-blur transition hover:border-white/40 hover:bg-slate-800/90">
        <span class="iconify text-base" data-icon="mdi:weather-sunny"></span>
    </button>

    <script src="/static/js/site-controls.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 40 });

        const card = document.getElementById("tiltCard");
        card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = -(y - centerY) / 15;
            const rotateY = (x - centerX) / 15;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        });
        card.addEventListener("mouseleave", () => {
            card.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
        });
    </script>
</body>
</html>
