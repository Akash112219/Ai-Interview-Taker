
<header class="glass sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200/70 px-4 py-3 shadow-sm backdrop-blur-xl md:px-10 md:py-3">
    <div class="flex items-center gap-4">
        <button title="Toggle Menu" aria-label="Toggle Menu" id="menu-toggle" class="rounded-full p-1 text-slate-500 transition-colors hover:text-primary">
            <iconify-icon icon="solar:hamburger-menu-linear" width="24" stroke-width="1.5"></iconify-icon>
        </button>
        <nav class="hidden items-center text-sm font-medium text-slate-400 sm:flex">
            <span class="cursor-pointer transition-colors hover:text-primary">{{ role_label }}</span>
            <iconify-icon icon="solar:alt-arrow-right-linear" class="mx-2 text-xs"></iconify-icon>
            <span class="text-primary">{{ page_label }}</span>
        </nav>
    </div>

    <div class="flex items-center gap-4 md:gap-6">
        <button title="Toggle Light Mode" aria-label="Toggle Light Mode" type="button" data-theme-toggle data-theme-icon-only class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white/70 text-slate-500 transition hover:border-slate-300 hover:text-primary">
            <span class="iconify text-lg" data-icon="mdi:weather-sunny"></span>
        </button>

        <div class="h-8 w-px bg-slate-200"></div>

        <div class="relative" id="notification-container">
            <button title="View Notifications" aria-label="View Notifications" id="notification-button" class="relative rounded-full p-1.5 text-slate-400 transition-colors hover:bg-secondary hover:text-primary">
                <iconify-icon icon="solar:bell-linear" width="22" stroke-width="1.5"></iconify-icon>
                <span class="notification-badge">{{ notification_count }}</span>
            </button>
            <div class="notification-dropdown" id="notification-dropdown">
                <div class="border-b border-slate-200 p-4">
                    <h3 class="font-semibold text-slate-800">Notifications</h3>
                </div>
                <div class="max-h-80 overflow-y-auto">
                    {% for note in ui_notifications %}
                    <div class="notification-item">
                        <div class="flex items-start gap-3">
                            <div class="mt-1">
                                <iconify-icon icon="{{ note.icon }}" width="20" class="{{ note.tone }}"></iconify-icon>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-slate-900">{{ note.title }}</p>
                                <p class="text-xs text-slate-500">{{ note.subtitle }}</p>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                    {% if not ui_notifications %}
                    <div class="p-8 text-center text-slate-400 italic">No new notifications</div>
                    {% endif %}
                </div>
                <div class="p-3 text-center border-t border-slate-100">
                    <a class="text-sm text-primary hover:underline" href="{{ notification_url }}">View all notifications</a>
                </div>
            </div>
        </div>

        <a href="{{ profile_url }}" class="group flex items-center gap-3 border-l border-slate-200 pl-4 cursor-pointer">
            <div class="hidden text-right md:block">
                <div class="flex items-center gap-1">
                    <span class="text-sm font-semibold text-dark group-hover:text-primary transition-colors">{{ profile_name }}</span>
                    <iconify-icon icon="solar:verified-check-line-duotone" width="16" height="16" class="text-blue-500"></iconify-icon>
                </div>
                <p class="text-xs text-slate-400">{{ profile_role }}</p>
            </div>
            <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-primary to-blue-400 p-[2px]">
                <img src="{{ profile_image }}" alt="{{ profile_name }}" class="h-full w-full rounded-full border-2 border-white object-cover">
            </div>
        </a>
    </div>
</header>
