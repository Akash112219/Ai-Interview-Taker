<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal | AI Interviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class" }</script>
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-soft: #dbeafe;
            --secondary: #eff6ff;
            --dark: #0f172a;
        }

        .bg-primary { background-color: var(--primary); }
        .text-primary { color: var(--primary); }
        .bg-secondary { background-color: var(--secondary); }
        .text-dark { color: var(--dark); }
        .glass { -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); background: rgba(255, 255, 255, 0.76); }
        .sidebar-transition { transition: transform 220ms ease, opacity 220ms ease; }
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 1.2rem;
            height: 1.2rem;
            padding: 0 0.35rem;
            border-radius: 9999px;
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            line-height: 1.2rem;
            text-align: center;
        }
        .notification-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 0.75rem);
            width: min(22rem, calc(100vw - 2rem));
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            display: none;
            overflow: hidden;
            z-index: 40;
        }
        .notification-dropdown.open { display: block; }
        .notification-item { padding: 1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.12); }
        .notification-item:last-child { border-bottom: none; }
        .content-shell { transition: padding-left 220ms ease; }

        /* Slim, polished scrollbar for sidebar navigation */
        #sidebar nav {
            scroll-behavior: smooth;
        }

        #sidebar nav::-webkit-scrollbar {
            width: 6px;
        }

        #sidebar nav::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 9999px;
        }

        #sidebar nav::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.75), rgba(14, 165, 233, 0.62));
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        #sidebar nav::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.95), rgba(14, 165, 233, 0.82));
        }

        /* Essential Global Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        body:not(.light-mode) .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 163, 184, 0.6); }
        body:not(.light-mode) .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.4); }

        @media (min-width: 768px) {
            body.sidebar-open .content-shell {
                padding-left: 16rem;
            }
        }

        #page-background {
            background: radial-gradient(circle at 12% 8%, rgba(37, 99, 235, 0.24), transparent 30%),
                        radial-gradient(circle at 84% 18%, rgba(14, 165, 233, 0.16), transparent 32%),
                        linear-gradient(180deg, #020617 0%, #0f172a 100%);
        }

        body, header, footer, section, article, form, input, textarea, button, select, a, .iconify {
            transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
        }

        body {
            background: radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.28), transparent 24%),
                        radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.16), transparent 26%),
                        linear-gradient(180deg, #020617 0%, #0f172a 100%);
            color: #e2e8f0;
        }

        body.light-mode {
            background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 26%),
                        radial-gradient(circle at top right, rgba(14, 165, 233, 0.1), transparent 24%),
                        linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
            color: #0f172a;
        }

        body.light-mode #page-background {
            background: radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.12), transparent 28%),
                        radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.1), transparent 30%),
                        linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
        }

        body:not(.light-mode) header,
        body:not(.light-mode) .glass,
        body:not(.light-mode) .notification-dropdown,
        body:not(.light-mode) .sidebar-shell,
        body:not(.light-mode) .page-shell {
            background: rgba(15, 23, 42, 0.82);
            color: #e2e8f0;
            border-color: rgba(148, 163, 184, 0.18);
        }

        body.light-mode header,
        body.light-mode .glass,
        body.light-mode .notification-dropdown,
        body.light-mode .sidebar-shell,
        body.light-mode .page-shell {
            background: rgba(255, 255, 255, 0.82);
            color: #0f172a;
            border-color: rgba(148, 163, 184, 0.18);
        }

        body:not(.light-mode) .text-slate-500,
        body:not(.light-mode) .text-slate-600,
        body:not(.light-mode) .text-slate-700,
        body:not(.light-mode) .text-slate-800,
        body:not(.light-mode) .text-slate-900,
        body:not(.light-mode) .text-dark { color: #e2e8f0 !important; }

        body:not(.light-mode) .bg-white,
        body:not(.light-mode) .bg-white\/70,
        body:not(.light-mode) .bg-white\/80,
        body:not(.light-mode) .bg-white\/90,
        body:not(.light-mode) .bg-white\/95 { background-color: rgba(15, 23, 42, 0.82) !important; }

        body:not(.light-mode) .border-slate-100,
        body:not(.light-mode) .border-slate-200,
        body:not(.light-mode) .border-white\/10,
        body:not(.light-mode) .border-white\/15 { border-color: rgba(148, 163, 184, 0.16) !important; }

        body:not(.light-mode) select option { background-color: #0f172a; color: #e2e8f0; }

        body:not(.light-mode) .bg-secondary { background: rgba(37, 99, 235, 0.15); }
        body:not(.light-mode) .text-primary { color: #93c5fd; }
        body:not(.light-mode) .bg-primary { background-color: #2563eb; }
        body:not(.light-mode) .notification-dropdown { background: rgba(15, 23, 42, 0.98); }
        body:not(.light-mode) .notification-item { border-bottom-color: rgba(148, 163, 184, 0.12); }
        body:not(.light-mode) .hover-nav:hover { background-color: rgba(255, 255, 255, 0.05); color: #93c5fd; }
        body:not(.light-mode) .hover-nav-logout:hover { background-color: rgba(239, 68, 68, 0.1); color: #fca5a5; }

        body:not(.light-mode) .hover-row:hover { background-color: rgba(255, 255, 255, 0.03); }
        body:not(.light-mode) .hover-btn:hover { background-color: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); }
        body:not(.light-mode) .hover-subtle:hover { background-color: rgba(255, 255, 255, 0.08); }

        body.light-mode .bg-secondary { background: #eff6ff; }
        body.light-mode .text-primary { color: #2563eb; }
        body.light-mode .bg-primary { background-color: #2563eb; }
        body.light-mode .notification-dropdown { background: rgba(255, 255, 255, 0.98); }
        body.light-mode .notification-item { border-bottom-color: rgba(148, 163, 184, 0.12); }
        body.light-mode .hover-nav:hover { background-color: #f8fafc; color: #2563eb; }
        body.light-mode .hover-nav-logout:hover { background-color: #fdf2f2; color: #f43f5e; }

        body.light-mode .hover-row:hover { background-color: rgba(15, 23, 42, 0.02); }
        body.light-mode .hover-btn:hover { background-color: #f8fafc; border-color: #cbd5e1; }
        body.light-mode .hover-subtle:hover { background-color: #f1f5f9; }

        body.light-mode select option { background-color: #ffffff; color: #0f172a; }

        body.light-mode #sidebar nav::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.65), rgba(14, 165, 233, 0.55));
            border: 1px solid rgba(255, 255, 255, 0.55);
        }
    </style>
</head>
<body class="min-h-screen antialiased">
    <div id="page-background" class="pointer-events-none fixed inset-0 -z-10"></div>

    {% include 'layouts/dashboard-sidebar.html' %}

    <div id="content-shell" class="content-shell min-h-screen">
        {% include 'layouts/dashboard-header.html' %}

        <main class="px-4 pb-8 pt-4 md:px-8 md:pt-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="sidebar-overlay" class="fixed inset-0 z-40 hidden bg-slate-950/35 backdrop-blur-sm md:hidden"></div>

    <script src="/static/js/site-controls.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 40 });

        (function () {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebar-overlay');
            var menuToggle = document.getElementById('menu-toggle');
            var notificationButton = document.getElementById('notification-button');
            var notificationDropdown = document.getElementById('notification-dropdown');

            function setSidebarOpen(isOpen) {
                if (!sidebar || !overlay) {
                    return;
                }

                sidebar.classList.toggle('-translate-x-full', !isOpen);
                sidebar.classList.toggle('translate-x-0', isOpen);
                overlay.classList.toggle('hidden', !isOpen);
                overlay.classList.toggle('block', isOpen);
                document.body.classList.toggle('sidebar-open', isOpen);
            }

            function openSidebar() {
                setSidebarOpen(true);
            }

            function closeSidebar() {
                setSidebarOpen(false);
            }

            closeSidebar();

            if (menuToggle) {
                menuToggle.addEventListener('click', function () {
                    if (sidebar && sidebar.classList.contains('-translate-x-full')) {
                        openSidebar();
                    } else {
                        closeSidebar();
                    }
                });
            }

            if (overlay) {
                overlay.addEventListener('click', closeSidebar);
            }

            if (notificationButton && notificationDropdown) {
                notificationButton.addEventListener('click', function (event) {
                    event.stopPropagation();
                    notificationDropdown.classList.toggle('open');
                });

                document.addEventListener('click', function (event) {
                    if (!notificationDropdown.contains(event.target) && !notificationButton.contains(event.target)) {
                        notificationDropdown.classList.remove('open');
                    }
                });
            }
        })();
    </script>
</body>
</html>
