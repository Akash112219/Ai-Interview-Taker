<aside id="sidebar" class="sidebar-shell sidebar-transition fixed inset-y-0 left-0 z-50 flex w-64 -translate-x-full transform flex-col border-r border-slate-100 bg-white/90 shadow-[4px_0_24px_rgba(0,0,0,0.02)] backdrop-blur-xl overflow-hidden">
    <div class="flex min-h-0 flex-1 flex-col">
        <div class="flex h-20 items-center border-b border-slate-50/50 px-8">
            <div class="flex items-center gap-3">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white shadow-lg shadow-primary/30">
                    <span class="text-lg font-semibold">{{ brand_initial or 'A' }}</span>
                </div>
                <span class="text-dark text-xl font-extrabold tracking-tight">{{ brand_name or 'AI Interviewer' }}</span>
            </div>
        </div>

        <nav class="min-h-0 flex-1 space-y-1 overflow-y-auto px-4 py-6">
            {% for section in nav_sections %}
            <p class="mb-4 px-4 text-xs font-semibold uppercase tracking-wider text-slate-400">{{ section['title'] }}</p>
            {% for item in section['items'] %}
            <a href="{{ item['href'] }}" class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium transition-all duration-200 {% if item['active'] %}bg-secondary text-primary{% else %}text-slate-500 hover-nav{% endif %}">
                <iconify-icon icon="{{ item['icon'] }}" width="20" stroke-width="1.5"></iconify-icon>
                <span>{{ item['label'] }}</span>
            </a>
            {% endfor %}
            {% endfor %}
        </nav>
    </div>

    <div class="border-t border-slate-50 p-4">
        <a href="/logout" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-500 transition-all duration-200 hover-nav-logout">
            <iconify-icon icon="solar:logout-2-linear" width="20" stroke-width="1.5"></iconify-icon>
            <span>Logout</span>
        </a>
    </div>
</aside>
